name: Desplega a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Genera config.js amb els secrets de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          cat > config.js <<EOT
          window.APP_CONFIG = {
            supabaseUrl: '$SUPABASE_URL',
            supabaseKey: '$SUPABASE_KEY'
          };
          EOT

      - name: Esborra fitxers que no s'han de publicar
        run: rm -rf .git .github supabase supabase.sql Claus.txt config.example.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
